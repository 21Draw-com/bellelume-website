# GitHub Pages (legacy Jekyll build from master /) publishes every file of the repo root except dot paths and
# underscore paths. Only the site may be public (#54, infra audit #338 F1). A new top-level path that is not
# part of the site goes into this list in the same PR. Removed once the site lives in its own folder (#56).
exclude:
  - CLAUDE.md
  - README.md
  - scripts/
  - tests/
  - docs/
  - "*.md"
  - "*.sh"
  - node_modules/
  - vendor/
  - "package*.json"
  - "Gemfile*"

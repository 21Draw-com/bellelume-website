# The kit contract as a CI step (builder kit README, Rollout step 3): every kit file equals the shipped version.
name: kit-check
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  kit-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: scripts/kit-check.sh
